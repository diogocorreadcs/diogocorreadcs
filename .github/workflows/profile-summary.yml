name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compress SVGs
        uses: SvanBoxel/svg-optimizer-action@main
        with:
          path: profile-summary-card-output

      - name: Update year in README
        run: |
          CURRENT_YEAR=$(date +%Y)
          sed -i "s/© [0-9]\{4\} Diogo Corrêa/© $CURRENT_YEAR Diogo Corrêa/g" README.md

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update profile cards, copyright year and optimize SVGs"
          file_pattern: "README.md profile-summary-card-output/*"
